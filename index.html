<style>
  :root{--bg:#0b0b0f;--card:#14141b;--border:#23232e;--text:#e8e8ee;--muted:#8a8a9a;--accent:#7c9cff;--online:#3ba55d;--offline:#747f8d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,#1a1a2e 0%,var(--bg) 60%);color:var(--text);font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;animation:in .6s ease both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .pfp{width:72px;height:72px;border-radius:50%;border:2px solid var(--border);object-fit:cover;background:#222}
  h1{font-size:1.4rem}
  .tag{color:var(--muted);font-size:.85rem;margin-top:2px}
  .status{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--offline)}
  .dot.online{background:var(--online)}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
  .activity{font-size:.8rem;color:var(--muted);margin-top:4px}.activity:empty{display:none}
  h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);margin:24px 0 10px}
  p{font-size:.9rem;line-height:1.6;color:#c4c4d0}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{color:var(--text);text-decoration:none;font-size:.85rem;padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:.15s}
  .links a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
  .tabs{position:fixed;top:16px;left:16px;display:flex;gap:6px;z-index:10}
  .tab{font:inherit;font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  .page[hidden]{display:none}
  .empty{text-align:center;color:var(--muted);padding:24px 0}
  .donor{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px}
  .donor .face{width:32px;height:32px;border-radius:4px;image-rendering:pixelated}
  .donor .name{font-size:1rem}
  .donor .rank{flex:1;font-size:1rem;font-weight:700;color:#ffd75e}
  .donor .cape{height:44px;width:auto;border-radius:3px;image-rendering:pixelated}
</style>
</head>

<script>
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.page').forEach(p => p.hidden = p.id !== 'page-' + t.dataset.tab);
  }));

  const DISCORD_ID = '1253900944836399157';
  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');
  const activityEl = document.getElementById('activity');

  function render(d) {
    const s = d.discord_status || 'offline';
    dot.className = 'dot ' + s;
    statusEl.textContent = s === 'dnd' ? 'Do Not Disturb' : s[0].toUpperCase() + s.slice(1);

    let text = '';
    if (d.listening_to_spotify && d.spotify) {
      text = '🎵 ' + d.spotify.song + ' - ' + d.spotify.artist;
    } else {
      const game = (d.activities || []).find(a => a.type === 0);
      const custom = (d.activities || []).find(a => a.type === 4);
      if (game) text = 'Playing ' + game.name;
      else if (custom && custom.state) text = custom.state;
    }
    activityEl.textContent = text;
  }

  // Initial load via REST
  fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID)
    .then(r => r.json())
    .then(j => j.success && render(j.data))
    .catch(() => {});

  // Live updates via websocket
  function connect() {
    const ws = new WebSocket('wss://api.lanyard.rest/socket');
    let beat;
    ws.onmessage = e => {
      const { op, d, t } = JSON.parse(e.data);
      if (op === 1) {
        beat = setInterval(() => ws.send(JSON.stringify({ op: 3 })), d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
      } else if (op === 0 && (t === 'INIT_STATE' || t === 'PRESENCE_UPDATE')) {
        render(d);
      }
    };
    ws.onclose = () => { clearInterval(beat); setTimeout(connect, 5000); };
  }
  connect();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yourname</title>
<meta name="description" content="Epic site, trust">
<meta property="og:title" content="yourname">
<meta property="og:description" content="Epic site, trust">
<style>
  :root{--bg:#0b0b0f;--card:#14141b;--border:#23232e;--text:#e8e8ee;--muted:#8a8a9a;--accent:#7c9cff;--online:#3ba55d;--offline:#747f8d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,#1a1a2e 0%,var(--bg) 60%);color:var(--text);font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;animation:in .6s ease both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .pfp{width:72px;height:72px;border-radius:50%;border:2px solid var(--border);object-fit:cover;background:#222}
  h1{font-size:1.4rem}
  .tag{color:var(--muted);font-size:.85rem;margin-top:2px}
  .status{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--offline)}
  .dot.on{background:var(--online)}
  h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);margin:24px 0 10px}
  p{font-size:.9rem;line-height:1.6;color:#c4c4d0}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{color:var(--text);text-decoration:none;font-size:.85rem;padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:.15s}
  .links a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
  .notice{margin-top:24px;padding:16px;border:1px solid #4a2b2b;background:#1d1214;border-radius:10px}
  .notice h3{font-size:.95rem;margin-bottom:6px;color:#ff8a8a}
  .notice .row{display:flex;gap:8px;margin-top:12px}
  .btn{font:inherit;font-size:.8rem;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--accent);color:#0b0b0f;border-color:var(--accent)}
  .btn:hover{opacity:.85}
  .hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <img class="pfp" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="pfp">
    <div>
      <h1>yourname</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Offline</span></div>
    </div>
  </div>

  <h2>about</h2>
  <p>I like playing minecraft</p>

  <h2>links</h2>
  <div class="links">
    <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub ↗</a>
    <a href="https://discord.com/users/YOUR_ID" target="_blank" rel="noopener">Discord ↗</a>
    <a href="https://namemc.com/profile/yourname" target="_blank" rel="noopener">NameMC ↗</a>
  </div>

  <div class="notice" id="notice">
    <h3>Notice</h3>
    <p>Put any announcement here, like a new Discord account.</p>
    <div class="row">
      <a class="btn primary" href="#" target="_blank" rel="noopener">Go to New Discord</a>
      <button class="btn" id="dismiss">Dismiss</button>
    </div>
  </div>
</main>

<script>
  // Dismiss notice (remembered if storage is available)
  const notice = document.getElementById('notice');
  try { if (localStorage.getItem('noticeDismissed')) notice.classList.add('hidden'); } catch(e){}
  document.getElementById('dismiss').onclick = () => {
    notice.classList.add('hidden');
    try { localStorage.setItem('noticeDismissed','1'); } catch(e){}
  };

  // Optional live Discord status via Lanyard: set your Discord ID and join discord.gg/lanyard
  const DISCORD_ID = '';
  if (DISCORD_ID) {
    fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID)
      .then(r => r.json())
      .then(({data}) => {
        const s = data.discord_status;
        document.getElementById('status').textContent = s[0].toUpperCase() + s.slice(1);
        document.getElementById('dot').classList.toggle('on', s !== 'offline');
      }).catch(() => {});
  }
</script>
</body>
</html>
